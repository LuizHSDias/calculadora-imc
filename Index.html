<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <div class="container py-5">

        <div class="d-flex justify-content-end mb-4">
            <button type="button" id="tema" class="btn btn-dark">
                🌙 Tema
            </button>
        </div>

        <div class="card shadow-lg mx-auto">

            <div class="card-body p-5">

                <h1 class="text-center fw-bold mb-5">
                    🏋️ Calculadora IMC
                </h1>

                <form id="formulario">

                    <div class="mb-4">

                        <label for="nome" class="form-label">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            class="form-control"
                            placeholder="Digite seu nome"
                            required>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-4">

                            <label for="peso" class="form-label">
                                Peso (kg)
                            </label>

                            <input
                                type="number"
                                id="peso"
                                class="form-control"
                                step="0.1"
                                placeholder="Ex: 70.5"
                                required>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label for="altura" class="form-label">
                                Altura (m)
                            </label>

                            <input
                                type="number"
                                id="altura"
                                class="form-control"
                                step="0.01"
                                placeholder="Ex: 1.75"
                                required>

                        </div>

                    </div>

                    <div class="row g-2">

                        <div class="col-6">

                            <button
                                type="reset"
                                id="cancelar"
                                class="btn btn-secondary w-100">

                                Limpar

                            </button>

                        </div>

                        <div class="col-6">

                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                Calcular

                            </button>

                        </div>

                    </div>

                </form>

                <div id="resultado" class="mt-4"></div>

            </div>

        </div>

        <div class="card shadow mt-4 mx-auto">

            <div class="card-body">

                <h3 class="mb-3">
                    📊 Tabela IMC
                </h3>

                <table class="table table-hover">

                    <thead>
                        <tr>
                            <th>IMC</th>
                            <th>Classificação</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>Menor que 18.5</td>
                            <td>Abaixo do peso</td>
                        </tr>

                        <tr>
                            <td>18.5 a 24.9</td>
                            <td>Peso normal</td>
                        </tr>

                        <tr>
                            <td>25 a 29.9</td>
                            <td>Sobrepeso</td>
                        </tr>

                        <tr>
                            <td>30 a 34.9</td>
                            <td>Obesidade Grau I</td>
                        </tr>

                        <tr>
                            <td>35 a 39.9</td>
                            <td>Obesidade Grau II</td>
                        </tr>

                        <tr>
                            <td>40 ou mais</td>
                            <td>Obesidade Grau III</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <div class="card shadow mt-4 mx-auto">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <h3>
                        📜 Histórico de Cálculos
                    </h3>

                    <button
                        id="limparHistorico"
                        class="btn btn-danger btn-sm">

                        Limpar Histórico

                    </button>

                </div>

                <ul
                    id="historico"
                    class="list-group mt-3">

                </ul>

            </div>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
